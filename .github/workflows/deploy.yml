name: Validate FPVLovers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: fpvlovers-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CRAWL_DRY_RUN: 'true'
      DIFY_API_KEY: build-placeholder-not-a-real-secret
      DIFY_BASE_URL: https://dify.invalid/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify contracts
        run: |
          npm run content:topic-cover-test
          npm run content:cover-test
          npm run editorial:governance-test
          npm run social:contracts-test
          npm run crawl:worker-test

      - name: Verify repository
        run: |
          npm run security:audit
          npm run quality:recent
          npm run routes:audit
          npm run content:audit
          npm run content:smoke
          npm run metadata:test
          npm run media:audit
          npm run handoff:test

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Production deploys from main through the existing Coolify application.
