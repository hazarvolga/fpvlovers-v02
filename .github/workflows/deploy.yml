name: Validate FPVLovers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: fpvlovers-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CRAWL_DRY_RUN: 'true'
      DIFY_API_KEY: build-placeholder-not-a-real-secret
      DIFY_BASE_URL: https://dify.invalid/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify contracts
        run: |
          pnpm content:topic-cover-test
          pnpm content:cover-test
          pnpm editorial:governance-test
          pnpm social:contracts-test

      - name: Verify repository
        run: |
          pnpm security:audit
          pnpm quality:recent
          pnpm routes:audit
          pnpm content:audit
          pnpm content:smoke
          pnpm metadata:test
          pnpm media:audit
          pnpm handoff:test

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Production deploys from main through the existing Coolify application.
