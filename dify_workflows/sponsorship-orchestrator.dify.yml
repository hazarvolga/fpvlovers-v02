                Sponsor: {{#1746720000001.sponsor_name#}}
                Category: {{#1746720000001.sponsor_category#}}
                Analysis: {{#1746720001001.text#}}
                Score: {{#1746720002001.visibility_score#}}
                Tier: {{#1746720002001.budget_tier#}}
