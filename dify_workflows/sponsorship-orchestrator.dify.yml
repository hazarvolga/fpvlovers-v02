      - id: "1746720006001"
        type: custom
        position:
          x: 1880
          y: 282
        data:
          type: code
          title: "Admin Approval"
          desc: "Auto-approve or flag for review"
          code_language: python3
          variables:
            - variable: visibility_score
              value_selector:
                - "1746720002001"
                - visibility_score
            - variable: approved
              value_selector:
                - "1746720002001"
                - approved
          code: |
            import json

            def main(visibility_score: int, approved: bool) -> dict:
                if visibility_score >= 75 and approved:
                    status = "auto-approved"
                    action = "activate_immediately"
                elif visibility_score >= 50 and approved:
                    status = "approved"
                    action = "activate"
                elif visibility_score >= 30:
                    status = "review_needed"
                    action = "manual_review"
                else:
                    status = "rejected"
                    action = "decline"

                return {
                    "status": status,
                    "action": action,
                    "visibility_score": visibility_score,
                    "approved": approved,
                    "message": f"Sponsor {status}. Score: {visibility_score}/100",
                }
          outputs:
            status:
              type: string
              children: null
            action:
              type: string
              children: null
            visibility_score:
              type: number
              children: null
            approved:
              type: boolean
              children: null
            message:
              type: string
              children: null
