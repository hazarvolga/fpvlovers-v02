          text: 'Generate valid JSON-LD schema.org markup for this FPV article:

            1. Article schema (headline, description, datePublished, author)

            2. FAQ schema if the article contains questions/answers

            3. Product schema if specific products are reviewed

            Output clean JSON-LD blocks ready for HTML injection.

            '
          id: 0cfedea2-7a3c-4f29-9451-875e8728db5e
        - role: user
          text: 'Article: {{#1746700005001.text#}}

            Metadata: {{#1746700003001.text#}}

            Affiliate Analysis: {{#1746700006001.result#}}

            '
          id: f880b9e8-e4bc-41ab-96c4-fdd5ee661ea3
        context:
          enabled: false
