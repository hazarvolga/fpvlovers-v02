      - id: "1746710003001-source-1746710004001-target"
        source: "1746710003001"
        sourceHandle: source
        target: "1746710004001"
        targetHandle: target
        type: custom
        zIndex: 0
        data:
          sourceType: code
          targetType: code
      - id: "1746710004001-source-1746710005001-target"
        source: "1746710004001"
        sourceHandle: source
        target: "1746710005001"
        targetHandle: target
        type: custom
        zIndex: 0
        data:
          sourceType: code
          targetType: llm
      - id: "1746710005001-source-1746710006001-target"
        source: "1746710005001"
        sourceHandle: source
        target: "1746710006001"
        targetHandle: target
        type: custom
        zIndex: 0
        data:
          sourceType: llm
          targetType: code
      - id: "1746710006001-source-1746710007001-target"
        source: "1746710006001"
        sourceHandle: source
        target: "1746710007001"
        targetHandle: target
        type: custom
        zIndex: 0
        data:
          sourceType: code
          targetType: http-request
      - id: "1746710007001-source-1746710008001-target"
        source: "1746710007001"
        sourceHandle: source
        target: "1746710008001"
        targetHandle: target
        type: custom
        zIndex: 0
        data:
