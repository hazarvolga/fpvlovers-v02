      - id: "1746710002001-false-1746710008002-target"
        source: "1746710002001"
        sourceHandle: "false"
        target: "1746710008002"
        targetHandle: target
        type: custom
        zIndex: 0
        data:
          sourceType: if-else
          targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 0.7
